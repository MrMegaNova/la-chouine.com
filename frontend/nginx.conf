server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vraie IP client derrière Traefik (#144). nginx n'est joignable que par
    # Traefik (port 80 non publié, uniquement sur le réseau Docker) : on fait
    # confiance aux plages privées et on lit X-Forwarded-For posé par Traefik.
    # $remote_addr (donc l'access log) et X-Forwarded-For transmis au backend
    # reflètent alors le client réel, pas l'IP du réseau Docker.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Masque la version de nginx dans les réponses/erreurs.
    server_tokens off;

    # En-têtes de sécurité du SPA (#118). Ré-inclus plus bas dans les locations
    # qui ont leur propre add_header (nginx remplace, ne fusionne pas).
    include /etc/nginx/security-headers.conf;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/manifest+json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Pages publiques pré-rendues (#271). La liste doit rester synchronisée avec
    # PUBLIC_PAGES (src/seo/pages.ts) : un test le vérifie.
    location = / {
        include /etc/nginx/security-headers.conf;  # add_header local → réinclure
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /index.html =404;
    }
    location ~ ^/(jouer|regles|a-propos)/?$ {
        include /etc/nginx/security-headers.conf;  # add_header local → réinclure
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /$1/index.html =404;
    }

    # Routes privées de l'application : coquille vide, exclue de l'index. Toute
    # nouvelle route React doit être ajoutée ici, sinon elle répond 404.
    location ~ ^/(jeu|connexion|amis|profil|reset-password|verify-email|joueur/[^/]+|invitation/[^/]+|i/[^/]+)/?$ {
        include /etc/nginx/security-headers.conf;  # add_header local → réinclure
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Robots-Tag "noindex";
        try_files /spa.html =404;
    }
    location = /spa.html {
        internal;
    }

    # PWA (#212). Service worker et manifeste sans cache long, pour qu'un
    # déploiement soit vu : un `location =` passe avant le cache long des assets.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;  # add_header local → réinclure
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;  # absent de mime.types selon la version
        include /etc/nginx/security-headers.conf;  # add_header local → réinclure
        add_header Cache-Control "no-cache";
    }
    # Page d'erreur réseau, mise en cache par le service worker.
    location = /offline.html {
        include /etc/nginx/security-headers.conf;  # add_header local → réinclure
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex";
    }

    # Fichiers statiques (robots.txt, sitemap.xml...) ; le reste répond 404.
    location / {
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Proxy API vers le backend
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # WebSocket PvP (matchmaking + parties en ligne) — en-têtes d'upgrade requis.
    location /ws {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;  # connexions longues (partie en cours)
    }

    # Cache long terme pour les assets avec hash Vite
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        expires 1y;
        include /etc/nginx/security-headers.conf;  # add_header local → réinclure
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Pas de cache pour index.html (déploiements fréquents)
    location = /index.html {
        include /etc/nginx/security-headers.conf;  # add_header local → réinclure
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
