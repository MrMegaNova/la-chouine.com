# Environnement de production
# Usage : docker compose -f docker-compose.prod.yml up -d
#
# Prérequis : copier .env.example → .env et renseigner toutes les variables.
# Les images sont tirées de ghcr.io lors d'une release GitHub.

services:

  db:
    image: postgres:18-alpine
    restart: always
    networks:
      - lachouine
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
      PGDATA:            /var/lib/postgresql/data
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: always
    networks:
      - lachouine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/mrmeganova/la-chouine.com/backend:${TAG:-latest}
    restart: always
    networks:
      - lachouine
    environment:
      NODE_ENV:       production
      PORT:           "3000"
      # Traefik + nginx = 2 proxies devant le backend (#144) → vraie IP client.
      TRUST_PROXY:    "2"
      PGHOST:         db
      PGPORT:         "5432"
      PGUSER:         ${POSTGRES_USER}
      PGPASSWORD:     ${POSTGRES_PASSWORD}
      PGDATABASE:     ${POSTGRES_DB}
      PGSSLMODE:      disable
      # État temps-réel PvP (file, sessions, présence) — Redis obligatoire (#31).
      REDIS_URL:      redis://redis:6379
      JWT_SECRET:     ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SMTP_HOST:      ${SMTP_HOST}
      SMTP_PORT:      ${SMTP_PORT:-587}
      SMTP_SECURE:    ${SMTP_SECURE:-false}
      SMTP_USER:      ${SMTP_USER}
      SMTP_PASS:      ${SMTP_PASS}
      SMTP_FROM:      ${SMTP_FROM}
      FRONTEND_URL:   ${FRONTEND_URL}
    volumes:
      # Base MaxMind tenue à jour par geoipupdate (#311), en lecture seule.
      - geoip_data:/geoip:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Géolocalisation des visites (#311) : télécharge la base gratuite MaxMind
  # GeoLite2 City et la met à jour tous les 3 jours (la licence impose une base
  # de moins de 30 jours). Sans identifiants, le backend reste sur DB-IP.
  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate:v8.0.0
    restart: unless-stopped
    networks:
      - lachouine
    environment:
      GEOIPUPDATE_ACCOUNT_ID:  ${MAXMIND_ACCOUNT_ID}
      GEOIPUPDATE_LICENSE_KEY: ${MAXMIND_LICENSE_KEY}
      GEOIPUPDATE_EDITION_IDS: GeoLite2-City
      GEOIPUPDATE_FREQUENCY:   "72"
    volumes:
      - geoip_data:/usr/share/GeoIP

  frontend:
    image: ghcr.io/mrmeganova/la-chouine.com/frontend:${TAG:-latest}
    restart: always
    networks:
      - lachouine
      - traefik
    depends_on:
      - backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.www-la-chouine-com.middlewares=redirect-non-www-to-www
      - traefik.http.routers.www-la-chouine-com.rule=Host(`www.la-chouine.com`) || Host(`la-chouine.com`)
      - traefik.http.services.www-la-chouine-com.loadbalancer.server.port=80

volumes:
  postgres_prod_data:
  geoip_data:

networks:
  lachouine:
    name: lachouine
  traefik:
    name: traefik
    external: true
